[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "microduck-football-rl"
version = "1.0.0"
description = "MicroDuck football reinforcement learning course with Gymnasium and PPO"
requires-python = ">=3.10"
dependencies = [
  "gymnasium>=1.0,<2",
  "numpy>=1.26,<3",
  "stable-baselines3>=2.5,<3",
  "torch>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
